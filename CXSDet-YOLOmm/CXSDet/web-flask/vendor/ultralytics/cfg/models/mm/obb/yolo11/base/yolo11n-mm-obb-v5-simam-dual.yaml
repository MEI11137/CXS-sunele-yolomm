# V5 + SimAM 双点 - RGB_P4后 + Fused_P4后 双重注意力
# 基础: V5-asym | 创新: SimAM在层7(RGB_P4后) + 层21(Fused_P4后)
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, SimAM, []]                    # 7 SimAM (RGB_P4后, 创新1)
  - [-1, 1, Conv, [1024, 3, 2]]           # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 9
  - [-1, 1, SPPF, [1024, 5]]              # 10
  - [-1, 2, C2PSA, [1024]]                # 11 (RGB_P5)

  - [-1, 1, Conv, [64, 3, 2], 'X']        # 12
  - [-1, 1, Conv, [128, 3, 2]]            # 13
  - [-1, 2, C3k2, [256, False, 0.25]]     # 14
  - [-1, 1, Conv, [256, 3, 2]]            # 15-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 16 (X_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 17-P4/16
  - [-1, 2, C3k2, [512, True]]            # 18 (X_P4)

  - [[7, 18], 1, Concat, [1]]             # 19 P4 融合
  - [-1, 2, C3k2, [1024, True]]           # 20 (Fused_P4)
  - [-1, 1, SimAM, []]                    # 21 SimAM (Fused_P4后, 创新2)

head:
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]  # 22
  - [[-1, 21], 1, Concat, [1]]                   # 23
  - [-1, 2, C3k2, [512, False]]                  # 24
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 25
  - [[-1, 4], 1, Concat, [1]]                    # 26
  - [-1, 2, C3k2, [256, False]]                  # 27 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                   # 28
  - [[-1, 24], 1, Concat, [1]]                   # 29
  - [-1, 2, C3k2, [512, False]]                  # 30 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                   # 31
  - [[-1, 11], 1, Concat, [1]]                   # 32
  - [-1, 2, C3k2, [1024, True]]                  # 33 (P5/32)
  - [[27, 30, 33], 1, OBB, [nc, 1]]              # 34 OBB Head
