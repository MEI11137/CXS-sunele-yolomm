# Ultralytics YOLOMM 🚀 多模态旋转框 - baseline + C3k2_EMA
# 基础: baseline yolo11n-mm-obb (P4+P5 mid 融合)
# 创新: 骨干 P4/P5 层和融合层 C3k2 → C3k2_EMA (高效多尺度注意力, 几乎无额外参数)
# 假设: 多尺度注意力增强特征表达 → 提升 recall 和定位精度
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # RGB 路径
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 (P3 保持 C3k2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5
  - [-1, 2, C3k2_EMA, [512, True]]        # 6 (RGB_P4, EMA)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7
  - [-1, 2, C3k2_EMA, [1024, True]]       # 8 (EMA)
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # X 路径
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11
  - [-1, 1, Conv, [128, 3, 2]]            # 12
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15
  - [-1, 1, Conv, [512, 3, 2]]            # 16
  - [-1, 2, C3k2_EMA, [512, True]]        # 17 (X_P4, EMA)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18
  - [-1, 2, C3k2_EMA, [1024, True]]       # 19 (EMA)
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (X_P5)

  # P4/P5 融合 (融合层也用 EMA)
  - [[6, 17], 1, Concat, [1]]             # 22
  - [-1, 2, C3k2_EMA, [1024, True]]       # 23 (Fused_P4, EMA)
  - [[10, 21], 1, Concat, [1]]            # 24
  - [-1, 2, C3k2_EMA, [1024, True]]       # 25 (EMA)
  - [-1, 1, C2PSA, [1024]]                # 26 (Fused_P5)

head:
  - [26, 1, nn.Upsample, [None, 2, "nearest"]]  # 27
  - [[-1, 23], 1, Concat, [1]]                  # 28
  - [-1, 2, C3k2, [512, False]]                 # 29 (head 保持 C3k2)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 30
  - [[-1, 4], 1, Concat, [1]]                   # 31
  - [-1, 2, C3k2, [256, False]]                 # 32 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                  # 33
  - [[-1, 29], 1, Concat, [1]]                  # 34
  - [-1, 2, C3k2, [512, False]]                 # 35 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                  # 36
  - [[-1, 26], 1, Concat, [1]]                  # 37
  - [-1, 2, C3k2, [1024, True]]                 # 38 (P5/32)
  - [[32, 35, 38], 1, OBB, [nc, 1]]             # 39 OBB Head
