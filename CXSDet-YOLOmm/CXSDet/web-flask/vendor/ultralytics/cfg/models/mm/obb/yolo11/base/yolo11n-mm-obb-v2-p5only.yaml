# Ultralytics YOLOMM 🚀 多模态旋转框 - V2 仅 P5 单点融合
# 变体: 去掉 P4 融合，只在最高语义层 P5 融合；P3/P4 用 RGB 单路
# 假设: 只在最高层融合已足够，且最轻量 (测试单点融合上限)
# 约束: Params/GFLOPs 涨幅 ≤ 10% (预期低于 baseline)

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # RGB 路径
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # X 路径 (完整，但仅 P5 参与融合)
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (X_P3, 未使用)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4, 未使用)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (X_P5)

  # 仅 P5 单点融合
  - [[10, 21], 1, Concat, [1]]            # 22 P5 融合
  - [-1, 2, C3k2, [1024, True]]           # 23
  - [-1, 1, C2PSA, [1024]]                # 24 (Fused_P5)

head:
  - [24, 1, nn.Upsample, [None, 2, "nearest"]]  # 25
  - [[-1, 6], 1, Concat, [1]]                   # 26 (接 RGB_P4)
  - [-1, 2, C3k2, [512, False]]                 # 27

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 28
  - [[-1, 4], 1, Concat, [1]]                   # 29 (接 RGB_P3)
  - [-1, 2, C3k2, [256, False]]                 # 30 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                   # 31
  - [[-1, 27], 1, Concat, [1]]                   # 32
  - [-1, 2, C3k2, [512, False]]                  # 33 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                   # 34
  - [[-1, 24], 1, Concat, [1]]                   # 35 (接 Fused_P5)
  - [-1, 2, C3k2, [1024, True]]                  # 36 (P5/32)

  - [[30, 33, 36], 1, OBB, [nc, 1]]              # 37 OBB Head(P3, P4, P5)
