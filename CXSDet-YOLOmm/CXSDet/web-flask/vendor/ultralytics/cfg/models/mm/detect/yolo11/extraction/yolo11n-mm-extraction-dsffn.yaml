# Ultralytics YOLOMM - DualScaleGatedFFN - Dual-scale Gated Feed-Forward Network (ECCV 2024)
# Mid-level Fusion + DualScaleGatedFFN inserted at RGB P4 (layer 7)
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2], 'RGB']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]            # 6 RGB_P4
  - [-1, 1, DualScaleGatedFFN, []]        # 7 DualScaleGatedFFN
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                # 11 RGB_P5
  - [-1, 1, Conv, [64, 3, 2], 'X']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]            # 18 X_P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                # 22 X_P5
  - [[7, 18], 1, Concat, [1]]             # 23 P4融合
  - [-1, 2, C3k2, [1024, True]]           # 24 Fused_P4
  - [[11, 22], 1, Concat, [1]]            # 25 P5融合
  - [-1, 2, C3k2, [1024, True]]           # 26
  - [-1, 1, C2PSA, [1024]]                # 27 Fused_P5

head:
  - [27, 1, nn.Upsample, [None, 2, "nearest"]]  # 28
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]           # 33 P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 30], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]           # 36 P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 27], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]           # 39 P5
  - [[33, 36, 39], 1, Detect, [nc]]
