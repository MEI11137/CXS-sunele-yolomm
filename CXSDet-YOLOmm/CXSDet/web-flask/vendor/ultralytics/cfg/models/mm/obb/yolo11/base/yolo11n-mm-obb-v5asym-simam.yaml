# Ultralytics YOLOMM 🚀 多模态旋转框 - V5-asym + SimAM (创新点A候选#1)
# 基础: V5-asym 非对称结构 (X只到P4, P5用RGB) - 72ep下最佳融合候选
# 创新: 在 RGB_P4 的 C3k2 后注入 SimAM 零参数注意力，增强P4判别力后再与X融合
# 假设: SimAM增强RGB特征 → 更好捕捉RGB/IR互补 → 提升precision和稀有类recall
# 约束: SimAM零参数, Params≈V5(3.37M), GFLOPs略增

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # RGB 路径 (完整)
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, SimAM, []]                    # 7 SimAM (新增, 零参数注意力)
  - [-1, 1, Conv, [1024, 3, 2]]           # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 9
  - [-1, 1, SPPF, [1024, 5]]              # 10
  - [-1, 2, C2PSA, [1024]]                # 11 (RGB_P5)

  # X 路径精简: 只到 P4
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 12-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 13-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 14
  - [-1, 1, Conv, [256, 3, 2]]            # 15-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 16 (X_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 17-P4/16
  - [-1, 2, C3k2, [512, True]]            # 18 (X_P4)

  # P4 融合 (用 SimAM 增强后的 RGB_P4 = 层7)
  - [[7, 18], 1, Concat, [1]]             # 19 P4 融合
  - [-1, 2, C3k2, [1024, True]]           # 20 (Fused_P4)

head:
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]  # 21 (从 RGB_P5 上采样)
  - [[-1, 20], 1, Concat, [1]]                   # 22 (接 Fused_P4)
  - [-1, 2, C3k2, [512, False]]                  # 23

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 24
  - [[-1, 4], 1, Concat, [1]]                    # 25 (接 RGB_P3)
  - [-1, 2, C3k2, [256, False]]                  # 26 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                   # 27
  - [[-1, 23], 1, Concat, [1]]                   # 28
  - [-1, 2, C3k2, [512, False]]                  # 29 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                   # 30
  - [[-1, 11], 1, Concat, [1]]                   # 31 (接 RGB_P5)
  - [-1, 2, C3k2, [1024, True]]                  # 32 (P5/32)

  - [[26, 29, 32], 1, OBB, [nc, 1]]              # 33 OBB Head(P3, P4, P5)
