# Ultralytics YOLOMM 🚀 V5-asym + SOEP-light (SPDConv 轻量增强)
# 基础: V5-asym (X路径只到P4, P5用RGB单路) — test mAP50=0.4731
# 创新: P3层加入SPDConv小目标增强 (无损下采样引入P2高分辨率信息)
# 设计: 仅新增1层SPDConv，最轻量，最接近达标线

# 注意: 本构型已修复AMP兼容性 (soep.py: FFT操作在FP32下执行)
# 训练时可开启AMP: model.train(..., amp=True)

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# P4/P5双层融合架构（同 V5-asym）
backbone:
  # ========== RGB路径 (层0-10) - 完整骨干网到P5 ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2 RGB路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 (RGB_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8 (RGB_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # ========== X路径 (层11-17) - 只到P4 ==========
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2 X路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13 (X_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8 (X_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (X_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)
  # X 路径到此结束，不再到 P5

  # ========== P4融合 ==========
  - [[6, 17], 1, Concat, [1]]             # 18 P4融合: RGB_P4(6) + X_P4(17)
  - [-1, 2, C3k2, [1024, True]]           # 19 (Fused_P4)

# SOEP-light 颈部 + OBB 检测头
head:
  # 自顶向下路径 (FPN)
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 20 (从 RGB_P5 上采样)
  - [[-1, 19], 1, Concat, [1]]                   # 21 (接 Fused_P4)
  - [-1, 2, C3k2, [512, False]]                  # 22

  # === SPDConv 轻量增强 P3 ===
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 23 上采样到P3尺度
  - [2, 1, SPDConv, [256]]                       # 24 RGB_P2(2)经过SPDConv处理
  - [[-1, -2, 4], 1, Concat, [1]]                # 25 三路融合: SPDConv(24) + FPN(23) + RGB_P3(4)
  - [-1, 2, C3k2, [256, False]]                  # 26 (增强的P3/8-small)

  # 自底向上路径 (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                    # 27
  - [[-1, 22], 1, Concat, [1]]                    # 28 (接 P4)
  - [-1, 2, C3k2, [512, False]]                   # 29 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 30
  - [[-1, 10], 1, Concat, [1]]                    # 31 (接 RGB_P5)
  - [-1, 2, C3k2, [1024, True]]                   # 32 (P5/32-large)

  - [[26, 29, 32], 1, OBB, [nc, 1]]               # 33 OBB Head(增强的P3, P4, P5)
