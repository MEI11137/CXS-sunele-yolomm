# Ultralytics YOLOMM 🚀 多模态旋转框 - V3 融合后加 C2PSA
# 变体: P4 融合后也加 C2PSA (与 P5 一致)，增强融合后双模态特征对齐
# 假设: 融合后立即做空间注意力，能更好对齐 RGB/IR 的空间错位
# 约束: Params/GFLOPs 涨幅 ≤ 10%

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # RGB 路径
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # X 路径
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (X_P5)

  # P4 融合 + C2PSA (新增 C2PSA)
  - [[6, 17], 1, Concat, [1]]             # 22 P4 融合
  - [-1, 2, C3k2, [1024, True]]           # 23
  - [-1, 1, C2PSA, [1024]]                # 24 (Fused_P4 + C2PSA)

  # P5 融合 + C2PSA
  - [[10, 21], 1, Concat, [1]]            # 25 P5 融合
  - [-1, 2, C3k2, [1024, True]]           # 26
  - [-1, 1, C2PSA, [1024]]                # 27 (Fused_P5)

head:
  - [27, 1, nn.Upsample, [None, 2, "nearest"]]  # 28
  - [[-1, 24], 1, Concat, [1]]                   # 29 (接 Fused_P4)
  - [-1, 2, C3k2, [512, False]]                  # 30

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 31
  - [[-1, 4], 1, Concat, [1]]                    # 32 (接 RGB_P3)
  - [-1, 2, C3k2, [256, False]]                  # 33 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                    # 34
  - [[-1, 30], 1, Concat, [1]]                    # 35
  - [-1, 2, C3k2, [512, False]]                   # 36 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                    # 37
  - [[-1, 27], 1, Concat, [1]]                    # 38 (接 Fused_P5)
  - [-1, 2, C3k2, [1024, True]]                   # 39 (P5/32)

  - [[33, 36, 39], 1, OBB, [nc, 1]]               # 40 OBB Head(P3, P4, P5)
