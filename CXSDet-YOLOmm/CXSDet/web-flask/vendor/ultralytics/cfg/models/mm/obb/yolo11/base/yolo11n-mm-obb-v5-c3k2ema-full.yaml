# V5 + C3k2_EMA 全替换 - 所有C3k2(含head)换C3k2_EMA, 最大化多尺度注意力
# 基础: V5-asym | 创新: 全网络 C3k2→C3k2_EMA (带0.25 expansion的P3层除外)
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 (P3保留C3k2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3, 保留)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2_EMA, [512, True]]        # 6 (RGB_P4, EMA)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2_EMA, [1024, True]]       # 8 (EMA)
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11
  - [-1, 1, Conv, [128, 3, 2]]            # 12
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13 (保留)
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (X_P3, 保留)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2_EMA, [512, True]]        # 17 (X_P4, EMA)

  - [[6, 17], 1, Concat, [1]]             # 18 P4 融合
  - [-1, 2, C3k2_EMA, [1024, True]]       # 19 (Fused_P4, EMA)

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 20
  - [[-1, 19], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2_EMA, [512, False]]              # 22 (EMA)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 23
  - [[-1, 4], 1, Concat, [1]]                    # 24
  - [-1, 2, C3k2_EMA, [256, False]]              # 25 (P3/8, EMA)
  - [-1, 1, Conv, [256, 3, 2]]                   # 26
  - [[-1, 22], 1, Concat, [1]]                   # 27
  - [-1, 2, C3k2_EMA, [512, False]]              # 28 (P4/16, EMA)
  - [-1, 1, Conv, [512, 3, 2]]                   # 29
  - [[-1, 10], 1, Concat, [1]]                   # 30
  - [-1, 2, C3k2_EMA, [1024, True]]              # 31 (P5/32, EMA)
  - [[25, 28, 31], 1, OBB, [nc, 1]]              # 32 OBB Head
