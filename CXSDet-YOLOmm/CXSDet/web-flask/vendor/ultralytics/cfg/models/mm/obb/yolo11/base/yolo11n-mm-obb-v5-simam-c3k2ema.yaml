# V5 + SimAM + C3k2_EMA - 双重创新: P4注意力 + 多尺度特征增强
# 基础: V5-asym | 创新1: RGB_P4后SimAM | 创新2: P4/P5骨干+融合层C3k2_EMA
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2_EMA, [512, True]]        # 6 (RGB_P4, EMA)
  - [-1, 1, SimAM, []]                    # 7 SimAM (创新1)
  - [-1, 1, Conv, [1024, 3, 2]]           # 8-P5/32
  - [-1, 2, C3k2_EMA, [1024, True]]       # 9 (EMA)
  - [-1, 1, SPPF, [1024, 5]]              # 10
  - [-1, 2, C2PSA, [1024]]                # 11 (RGB_P5)

  - [-1, 1, Conv, [64, 3, 2], 'X']        # 12
  - [-1, 1, Conv, [128, 3, 2]]            # 13
  - [-1, 2, C3k2, [256, False, 0.25]]     # 14
  - [-1, 1, Conv, [256, 3, 2]]            # 15-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 16 (X_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 17-P4/16
  - [-1, 2, C3k2_EMA, [512, True]]        # 18 (X_P4, EMA)

  - [[7, 18], 1, Concat, [1]]             # 19 P4 融合 (SimAM输出 + X_P4)
  - [-1, 2, C3k2_EMA, [1024, True]]       # 20 (Fused_P4, EMA)

head:
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 20], 1, Concat, [1]]                   # 22
  - [-1, 2, C3k2, [512, False]]                  # 23
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 24
  - [[-1, 4], 1, Concat, [1]]                    # 25
  - [-1, 2, C3k2, [256, False]]                  # 26 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                   # 27
  - [[-1, 23], 1, Concat, [1]]                   # 28
  - [-1, 2, C3k2, [512, False]]                  # 29 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                   # 30
  - [[-1, 11], 1, Concat, [1]]                   # 31
  - [-1, 2, C3k2, [1024, True]]                  # 32 (P5/32)
  - [[26, 29, 32], 1, OBB, [nc, 1]]              # 33 OBB Head
