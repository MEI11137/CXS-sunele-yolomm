# YOLOMM|RTDETRMM 多模态项目,汤圆版权所有,仅限学术用途
# RTDETRMM-r18 Detect Base: P2 Injection for Small Objects
# 思路: 利用 P2 的细粒度信息增强 P3，而不改变 RT-DETR 三尺度 decoder。
# 核心策略: 融合 RGB/X P2 后下采样注入 P3，同时保持 P4/P5 深层融合。
# 设计原则: 提升小目标感知能力，避免新增 P2 decoder 输入带来的任务链风险。
# 适用场景: 小目标密集、边界细节重要但仍需标准 RT-DETR 训练链的检测任务。
# Decoder contract: keep RTDETRDecoder inputs as P3/P4/P5.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB'] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # X stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X'] # 4-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 7-P2/4

  # RGB branch to P5
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 8-RGB P2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 9-RGB P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 10-RGB P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 11-RGB P5/32

  # X branch to P5
  - [7, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 12-X P2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 13-X P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 14-X P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 15-X P5/32

  # P2 injection + P4/P5 fusion
  - [[8, 12], 1, Concat, [1]] # 16-P2 RGB+X
  - [-1, 1, Conv, [128, 1, 1]] # 17-Fused P2
  - [-1, 1, Conv, [128, 3, 2]] # 18-P2 -> P3
  - [[9, 13, 18], 1, Concat, [1]] # 19-P3 with P2 injection
  - [-1, 1, Conv, [256, 1, 1]] # 20-Fused P3
  - [[10, 14], 1, Concat, [1]] # 21-P4 RGB+X
  - [-1, 1, Conv, [256, 1, 1]] # 22-Fused P4
  - [[11, 15], 1, Concat, [1]] # 23-P5 RGB+X
  - [-1, 1, Conv, [512, 1, 1]] # 24-Fused P5

head:
  - [24, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 25 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 26
  - [-1, 1, Conv, [256, 1, 1]] # 27 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 28
  - [22, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 29 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 30
  - [-1, 3, RepC3, [256, 0.5]] # 31
  - [-1, 1, Conv, [256, 1, 1]] # 32 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 33
  - [20, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 34 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 35
  - [-1, 3, RepC3, [256, 0.5]] # 36 P3

  - [-1, 1, Conv, [256, 3, 2]] # 37
  - [[-1, 32], 1, Concat, [1]] # 38
  - [-1, 3, RepC3, [256, 0.5]] # 39 P4

  - [-1, 1, Conv, [256, 3, 2]] # 40
  - [[-1, 27], 1, Concat, [1]] # 41
  - [-1, 3, RepC3, [256, 0.5]] # 42 P5

  - [[36, 39, 42], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
