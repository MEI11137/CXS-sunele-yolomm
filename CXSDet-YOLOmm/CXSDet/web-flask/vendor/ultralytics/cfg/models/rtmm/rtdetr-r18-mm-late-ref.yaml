# YOLOMM|RTDETRMM 多模态项目,汤圆版权所有,仅限学术用途
# RTDETRMM-r18 Detect Base: Late Feature Fusion Reference
# 思路: 尽量推迟 RGB/X 交互，让两路各自完成 FPN/PAN 后再融合。
# 核心策略: RGB/X 各自生成 P3/P4/P5 head features，decoder 前融合为单套 P3/P4/P5。
# 设计原则: 保持 late fusion 的分支独立性，同时避免双 decoder 破坏 RT-DETR loss 契约。
# 适用场景: 两模态差异较大，早中期融合可能互相干扰的检测任务。
# Decoder contract: keep RTDETRDecoder inputs as P3/P4/P5.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB'] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # X stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X'] # 4-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 7-P2/4

  # RGB branch to P5
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 8-RGB P2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 9-RGB P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 10-RGB P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 11-RGB P5/32

  # X branch to P5
  - [7, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 12-X P2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 13-X P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 14-X P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 15-X P5/32

head:
  # RGB FPN/PAN without decoder
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 16 RGB input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 17
  - [-1, 1, Conv, [256, 1, 1]] # 18 RGB Y5
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 19
  - [10, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 20 RGB input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 21
  - [-1, 3, RepC3, [256, 0.5]] # 22
  - [-1, 1, Conv, [256, 1, 1]] # 23 RGB Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 24
  - [9, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 25 RGB input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 26
  - [-1, 3, RepC3, [256, 0.5]] # 27 RGB P3
  - [-1, 1, Conv, [256, 3, 2]] # 28
  - [[-1, 23], 1, Concat, [1]] # 29
  - [-1, 3, RepC3, [256, 0.5]] # 30 RGB P4
  - [-1, 1, Conv, [256, 3, 2]] # 31
  - [[-1, 18], 1, Concat, [1]] # 32
  - [-1, 3, RepC3, [256, 0.5]] # 33 RGB P5

  # X FPN/PAN without decoder
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 34 X input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 35
  - [-1, 1, Conv, [256, 1, 1]] # 36 X Y5
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 37
  - [14, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 38 X input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 39
  - [-1, 3, RepC3, [256, 0.5]] # 40
  - [-1, 1, Conv, [256, 1, 1]] # 41 X Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 42
  - [13, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 43 X input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 44
  - [-1, 3, RepC3, [256, 0.5]] # 45 X P3
  - [-1, 1, Conv, [256, 3, 2]] # 46
  - [[-1, 41], 1, Concat, [1]] # 47
  - [-1, 3, RepC3, [256, 0.5]] # 48 X P4
  - [-1, 1, Conv, [256, 3, 2]] # 49
  - [[-1, 36], 1, Concat, [1]] # 50
  - [-1, 3, RepC3, [256, 0.5]] # 51 X P5

  # Late feature fusion before a single RTDETRDecoder
  - [[27, 45], 1, Concat, [1]] # 52 P3 late fusion
  - [-1, 1, Conv, [256, 1, 1]] # 53 Fused P3
  - [[30, 48], 1, Concat, [1]] # 54 P4 late fusion
  - [-1, 1, Conv, [256, 1, 1]] # 55 Fused P4
  - [[33, 51], 1, Concat, [1]] # 56 P5 late fusion
  - [-1, 1, Conv, [256, 1, 1]] # 57 Fused P5

  - [[53, 55, 57], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
