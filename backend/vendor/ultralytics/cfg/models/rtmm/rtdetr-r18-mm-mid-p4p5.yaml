# YOLOMM|RTDETRMM 多模态项目,汤圆版权所有,仅限学术用途
# RTDETRMM-r18 Detect Base: P4/P5 Deep Mid Fusion
# 思路: 保留浅层 RGB P3 细节，在高语义层显式融合 RGB/X。
# 核心策略: RGB/X 双路均提取到 P5，只融合 P4/P5，P3 采用 RGB shallow feature。
# 设计原则: 降低中低层融合成本，重点增强高层语义互补。
# 适用场景: X 模态主要提供语义级补充，浅层纹理以 RGB 为主的检测任务。
# Decoder contract: keep RTDETRDecoder inputs as P3/P4/P5.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB'] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # X stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X'] # 4-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 7-P2/4

  # RGB branch to P5
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 8-RGB P2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 9-RGB P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 10-RGB P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 11-RGB P5/32

  # X branch to P5
  - [7, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 12-X P2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 13-X P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 14-X P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 15-X P5/32

  # P4/P5 fusion
  - [[10, 14], 1, Concat, [1]] # 16-P4 RGB+X
  - [-1, 1, Conv, [256, 1, 1]] # 17-Fused P4
  - [[11, 15], 1, Concat, [1]] # 18-P5 RGB+X
  - [-1, 1, Conv, [512, 1, 1]] # 19-Fused P5

head:
  - [19, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 20 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 21
  - [-1, 1, Conv, [256, 1, 1]] # 22 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 23
  - [17, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 24 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 25
  - [-1, 3, RepC3, [256, 0.5]] # 26
  - [-1, 1, Conv, [256, 1, 1]] # 27 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 28
  - [9, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 29 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # 30
  - [-1, 3, RepC3, [256, 0.5]] # 31 P3

  - [-1, 1, Conv, [256, 3, 2]] # 32
  - [[-1, 27], 1, Concat, [1]] # 33
  - [-1, 3, RepC3, [256, 0.5]] # 34 P4

  - [-1, 1, Conv, [256, 3, 2]] # 35
  - [[-1, 22], 1, Concat, [1]] # 36
  - [-1, 3, RepC3, [256, 0.5]] # 37 P5

  - [[31, 34, 37], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
