# RTDETRMM r18 Mid-Fusion + ACA (Adaptive Channel Attention)
# Based on rtdetr-r18-mm-mid.yaml, adding ACA after Stage3 in both branches

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB Branch
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB'] # 0-P1/2 RGB input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # X Branch
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X'] # 4-P1/2 X input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 7-P2/4

  # RGB ResNet18 stages
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 8-RGB Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 9-RGB Stage3 P3/8
  - [-1, 1, ACA, [0.5]] # 10-ACA-RGB

  # X ResNet18 stages
  - [7, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 11-X Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 12-X Stage3 P3/8
  - [-1, 1, ACA, [0.5]] # 13-ACA-X

  # Mid-level Fusion at P3
  - [[10, 13], 1, Concat, [1]] # 14 - Concat RGB and X features at P3
  - [-1, 1, Conv, [256, 1, 1]] # 15 - Fusion conv

  # Continue processing fused features
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 16-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 17-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 18 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 19
  - [-1, 1, Conv, [256, 1, 1]] # 20

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 21
  - [16, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 22 input_proj.1 (from P4)
  - [[-2, -1], 1, Concat, [1]] # 23
  - [-1, 3, RepC3, [256, 0.5]] # 24
  - [-1, 1, Conv, [256, 1, 1]] # 25

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 26
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 27 input_proj.0 (from fused P3)
  - [[-2, -1], 1, Concat, [1]] # 28
  - [-1, 3, RepC3, [256, 0.5]] # 29

  - [-1, 1, Conv, [256, 3, 2]] # 30
  - [[-1, 25], 1, Concat, [1]] # 31
  - [-1, 3, RepC3, [256, 0.5]] # 32

  - [-1, 1, Conv, [256, 3, 2]] # 33
  - [[-1, 20], 1, Concat, [1]] # 34
  - [-1, 3, RepC3, [256, 0.5]] # 35

  - [[29, 32, 35], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 36
