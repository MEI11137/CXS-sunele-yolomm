# RTDETRMM r18 MROD-style Architecture
# Based on MROD-YOLO (IEEE TGRS 2025), adapted for RTDETRMM
# Key features: MJRNet early fusion + RFEM receptive field enhancement + standard RTDETRMM head
# Note: MSIA skipped due to ResNet18 stage channel mismatch (128/256/512)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB'] # 0-P1/2 RGB input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # X stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X'] # 4-P1/2 X input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 7-P2/4

  # MJRNet early fusion (both branches output 64 channels)
  - [[3, 7], 1, MJRNet, [64, 16]] # 8 - Early fusion

  # Fused single-path ResNet18
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 9-Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 10-Stage3 P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 11-Stage4 P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 12-Stage5 P5/32

  # RFEM receptive field enhancement
  - [-1, 1, RFEM, [512]] # 13

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 14 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 15
  - [-1, 1, Conv, [256, 1, 1]] # 16

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 18 input_proj.1 (from P4)
  - [[-2, -1], 1, Concat, [1]] # 19
  - [-1, 3, RepC3, [256, 0.5]] # 20
  - [-1, 1, Conv, [256, 1, 1]] # 21

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 22
  - [10, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 23 input_proj.0 (from P3)
  - [[-2, -1], 1, Concat, [1]] # 24
  - [-1, 3, RepC3, [256, 0.5]] # 25

  - [-1, 1, Conv, [256, 3, 2]] # 26
  - [[-1, 21], 1, Concat, [1]] # 27
  - [-1, 3, RepC3, [256, 0.5]] # 28

  - [-1, 1, Conv, [256, 3, 2]] # 29
  - [[-1, 16], 1, Concat, [1]] # 30
  - [-1, 3, RepC3, [256, 0.5]] # 31

  - [[25, 28, 31], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 32
