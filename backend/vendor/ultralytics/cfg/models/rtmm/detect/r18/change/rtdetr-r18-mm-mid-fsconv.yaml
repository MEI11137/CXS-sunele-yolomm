# RTDETRMM r18 Mid-Fusion + FSConv (Frequency Selective Convolution)
# Based on rtdetr-r18-mm-mid.yaml, replacing post-fusion Conv 1x1 with FSConv

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB Branch
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB'] # 0-P1/2 RGB input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # X Branch
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X'] # 4-P1/2 X input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 7-P2/4

  # RGB ResNet18 stages
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 8-RGB Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 9-RGB Stage3 P3/8

  # X ResNet18 stages
  - [7, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 10-X Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 11-X Stage3 P3/8

  # Mid-level Fusion at P3
  - [[9, 11], 1, Concat, [1]] # 12 - Concat RGB and X features at P3
  - [-1, 1, FSConv, [256, 1, 1]] # 13 - FSConv replaces Conv 1x1 for fusion

  # Continue processing fused features
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 14-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 15-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 16 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 17
  - [-1, 1, Conv, [256, 1, 1]] # 18

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 19
  - [14, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 20 input_proj.1 (from P4)
  - [[-2, -1], 1, Concat, [1]] # 21
  - [-1, 3, RepC3, [256, 0.5]] # 22
  - [-1, 1, Conv, [256, 1, 1]] # 23

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 24
  - [13, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 25 input_proj.0 (from fused P3)
  - [[-2, -1], 1, Concat, [1]] # 26
  - [-1, 3, RepC3, [256, 0.5]] # 27

  - [-1, 1, Conv, [256, 3, 2]] # 28
  - [[-1, 23], 1, Concat, [1]] # 29
  - [-1, 3, RepC3, [256, 0.5]] # 30

  - [-1, 1, Conv, [256, 3, 2]] # 31
  - [[-1, 18], 1, Concat, [1]] # 32
  - [-1, 3, RepC3, [256, 0.5]] # 33

  - [[27, 30, 33], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 34
