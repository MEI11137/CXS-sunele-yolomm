# Ultralytics YOLOMM 🚀 Mid-Fusion + SlimNeck-WFU
# YOLOMM RGB+X 中期融合 + SlimNeck-WFU 轻量化颈部
# 核心策略: 双路独立P5骨干网 + P4/P5双层融合 + WFU 小波加权上采样 + SlimNeck
# WFU: 用小波变换替代 nn.Upsample + Concat，通过 Haar 分解实现加权特征融合
# SlimNeck 论文: Slim-neck by GSConv (arXiv 2206.02424)
# 适用场景: 需要极致轻量化同时保持特征融合质量的多模态检测任务

# 重要提示:
# 1. 需要关闭混合精度训练: amp=False
# 2. 需要关闭半精度验证: self.args.half=False

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# P4/P5双层融合架构（同 yolo11n-mm-mid.yaml）
backbone:
  # ========== RGB路径 (层0-10) - 完整骨干网到P5 ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2 RGB路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8 (RGB_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # ========== X路径 (层11-21) - 完整骨干网到P5 ==========
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2 X路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8 (X_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (X_P5)

  # ========== P4和P5层级融合 ==========
  # P4级融合
  - [[6, 17], 1, Concat, [1]]             # 22 P4融合: RGB_P4(6) + X_P4(17)
  - [-1, 2, C3k2, [1024, True]]           # 23 (Fused_P4)

  # P5级融合
  - [[10, 21], 1, Concat, [1]]            # 24 P5融合: RGB_P5(10) + X_P5(21)
  - [-1, 2, C3k2, [1024, True]]           # 25
  - [-1, 1, C2PSA, [1024]]                # 26 (Fused_P5)

# SlimNeck-WFU 轻量化颈部 (WFU 小波上采样 + GSConv 下采样 + VoVGSCSP)
head:
  # WFU P4尺度融合: x_big=Fused_P4(23), x_small=Fused_P5(26)
  - [[23, 26], 1, WFU, []]                       # 27
  - [-1, 2, VoVGSCSP, [512]]                     # 28

  # WFU P3尺度融合: x_big=RGB_P3(4), x_small=P4输出(28)
  - [[4, 28], 1, WFU, []]                         # 29
  - [-1, 2, VoVGSCSP, [256]]                     # 30 (P3/8-small)

  # 自底向上路径 (PAN) — GSConv 替代标准 Conv
  - [-1, 1, GSConv, [256, 3, 2]]                 # 31
  - [[-1, 28], 1, Concat, [1]]                   # 32
  - [-1, 2, VoVGSCSP, [512]]                     # 33 (P4/16-medium)

  - [-1, 1, GSConv, [512, 3, 2]]                 # 34
  - [[-1, 26], 1, Concat, [1]]                   # 35
  - [-1, 2, VoVGSCSP, [1024]]                    # 36 (P5/32-large)

  - [[30, 33, 36], 1, Detect, [nc]]              # 37 Detect(P3, P4, P5)
