# Ultralytics YOLOMM 🚀 多模态旋转框 - V5 非对称 X 路径精简
# 变体: X 路径只到 P4 (去掉 P5 段)，P4 融合，P5 用 RGB 单路
# 假设: IR 不需要完整骨干到 P5，省参数；P5 语义层 RGB 已足够
# 约束: Params/GFLOPs 涨幅 ≤ 10% (预期显著低于 baseline)

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # RGB 路径 (完整)
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # X 路径精简: 只到 P4
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (X_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)
  # X 路径到此结束，不再到 P5

  # P4 融合 (P5 不融合，使用 RGB_P5)
  - [[6, 17], 1, Concat, [1]]             # 18 P4 融合
  - [-1, 2, C3k2, [1024, True]]           # 19 (Fused_P4)

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 20 (从 RGB_P5 上采样)
  - [[-1, 19], 1, Concat, [1]]                   # 21 (接 Fused_P4)
  - [-1, 2, C3k2, [512, False]]                  # 22

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 23
  - [[-1, 4], 1, Concat, [1]]                    # 24 (接 RGB_P3)
  - [-1, 2, C3k2, [256, False]]                  # 25 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                    # 26
  - [[-1, 22], 1, Concat, [1]]                    # 27
  - [-1, 2, C3k2, [512, False]]                   # 28 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                    # 29
  - [[-1, 10], 1, Concat, [1]]                    # 30 (接 RGB_P5)
  - [-1, 2, C3k2, [1024, True]]                   # 31 (P5/32)

  - [[25, 28, 31], 1, OBB, [nc, 1]]               # 32 OBB Head(P3, P4, P5)
