# Ultralytics YOLOMM 🚀 V5-asym + Dual-SPDConv (RGB_P2 + X_P2 双路增强)
# 基础: V5-asym (X路径只到P4)
# 创新: RGB_P2 和 X_P2 都经 SPDConv 无损下采样后融合到 P3
# 假设: 体检发现RGB↔IR边缘IoU仅0.146(几何信息差异大), 双路P2能充分利用两模态的空间细节
# 注意: soep.py 已修复AMP兼容性, 可开启amp=True

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 (RGB_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13 (X_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (X_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)

  - [[6, 17], 1, Concat, [1]]             # 18 P4融合
  - [-1, 2, C3k2, [1024, True]]           # 19 (Fused_P4)

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 20
  - [[-1, 19], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [512, False]]                  # 22

  # === 双路 P2 增强 ===
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 23 (FPN, 512ch)
  - [2, 1, SPDConv, [128]]                       # 24 (RGB_P2→128ch)
  - [13, 1, SPDConv, [128]]                      # 25 (X_P2→128ch)
  - [[-1, -2, -3, 4], 1, Concat, [1]]            # 26 (四路: SPD×2 + FPN + RGB_P3)
  - [-1, 1, CSPOmniKernel, []]                   # 27
  - [-1, 2, C3k2, [256, False]]                  # 28 (增强 P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                    # 29
  - [[-1, 22], 1, Concat, [1]]                    # 30
  - [-1, 2, C3k2, [512, False]]                   # 31 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                    # 32
  - [[-1, 10], 1, Concat, [1]]                    # 33
  - [-1, 2, C3k2, [1024, True]]                   # 34 (P5/32)
  - [[28, 31, 34], 1, OBB, [nc, 1]]               # 35
