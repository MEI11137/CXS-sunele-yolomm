# Ultralytics YOLOMM 🚀 多模态旋转框 - V4 Concat 后 Conv 降维
# 变体: P4/P5 融合 Concat 后先 1x1 Conv 压通道再 C3k2
# 假设: Concat 后立即降维可省参数/FLOPs，同时保留融合信息
# 约束: Params/GFLOPs 涨幅 ≤ 10% (预期低于 baseline)

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # RGB 路径
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # X 路径
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (X_P5)

  # P4 融合 + Conv 降维
  - [[6, 17], 1, Concat, [1]]             # 22 P4 融合
  - [-1, 1, Conv, [512, 1, 1]]            # 23 1x1 降维
  - [-1, 2, C3k2, [1024, True]]           # 24 (Fused_P4)

  # P5 融合 + Conv 降维
  - [[10, 21], 1, Concat, [1]]            # 25 P5 融合
  - [-1, 1, Conv, [1024, 1, 1]]           # 26 1x1 降维
  - [-1, 2, C3k2, [1024, True]]           # 27
  - [-1, 1, C2PSA, [1024]]                # 28 (Fused_P5)

head:
  - [28, 1, nn.Upsample, [None, 2, "nearest"]]  # 29
  - [[-1, 24], 1, Concat, [1]]                   # 30 (接 Fused_P4)
  - [-1, 2, C3k2, [512, False]]                  # 31

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 32
  - [[-1, 4], 1, Concat, [1]]                    # 33 (接 RGB_P3)
  - [-1, 2, C3k2, [256, False]]                  # 34 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                    # 35
  - [[-1, 31], 1, Concat, [1]]                    # 36
  - [-1, 2, C3k2, [512, False]]                   # 37 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                    # 38
  - [[-1, 28], 1, Concat, [1]]                    # 39 (接 Fused_P5)
  - [-1, 2, C3k2, [1024, True]]                   # 40 (P5/32)

  - [[34, 37, 40], 1, OBB, [nc, 1]]               # 41 OBB Head(P3, P4, P5)
