# Ultralytics YOLOMM 🚀 V5-asym + OmniKernel@P4 (P4融合层增强)
# 基础: V5-asym
# 创新: 不在P3做SPDConv增强, 而在Fused_P4后直接加CSPOmniKernel
# 假设: OmniKernel的多尺度核(1×31水平+31×1垂直+31×31全局)天然适合捕捉
#       体检发现的"所有类AR中位数2.1-2.5偏长方形"特征, 放在P4融合层可增强多模态融合质量
# 对比: 本构型与构型1(SOEP-basic@P3)形成位置对照实验
# 注意: soep.py 已修复AMP兼容性, 可开启amp=True

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 (RGB_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13 (X_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (X_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)

  - [[6, 17], 1, Concat, [1]]             # 18 P4融合
  - [-1, 2, C3k2, [1024, True]]           # 19 (Fused_P4)
  - [-1, 1, CSPOmniKernel, []]            # 20 ← 新增: 增强 Fused_P4

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 21 (从 RGB_P5)
  - [[-1, 20], 1, Concat, [1]]                   # 22 (接增强后 Fused_P4)
  - [-1, 2, C3k2, [512, False]]                  # 23

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 24
  - [[-1, 4], 1, Concat, [1]]                    # 25 (接 RGB_P3, 原始结构)
  - [-1, 2, C3k2, [256, False]]                  # 26 (P3/8 原始)

  - [-1, 1, Conv, [256, 3, 2]]                    # 27
  - [[-1, 23], 1, Concat, [1]]                    # 28
  - [-1, 2, C3k2, [512, False]]                   # 29 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                    # 30
  - [[-1, 10], 1, Concat, [1]]                    # 31
  - [-1, 2, C3k2, [1024, True]]                   # 32 (P5/32)
  - [[26, 29, 32], 1, OBB, [nc, 1]]               # 33
